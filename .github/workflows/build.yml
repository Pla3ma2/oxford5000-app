name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests + APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk oxford5000.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oxford5000-apk
          path: oxford5000.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Oxford 5000 · сборка ${{ github.run_number }}
          body: Скачайте oxford5000.apk на телефон и установите. Новая версия ставится поверх старой, прогресс сохраняется.
          files: oxford5000.apk
          make_latest: true

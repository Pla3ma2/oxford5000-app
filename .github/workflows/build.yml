name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests + APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk oxford5000.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oxford5000-apk
          path: oxford5000.apk

      # В Releases всегда лежит только одна, последняя версия: старые релизы и их теги удаляются.
      - name: Remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --cleanup-tag -y

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Oxford 5000
          body: Скачайте oxford5000.apk на телефон и установите. Новая версия ставится поверх старой, прогресс сохраняется.
          files: oxford5000.apk
          make_latest: true

  # Веб-версия (для iPhone и любых браузеров): публикуется в ветку gh-pages → GitHub Pages
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p site
          cp -r web/* site/
          cp app/src/main/assets/words.json app/src/main/assets/phrases.json site/
          sed -i "s/__VERSION__/${{ github.run_number }}/" site/sw.js
          touch site/.nojekyll

      - name: Deploy to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
